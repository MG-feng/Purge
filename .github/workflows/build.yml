name: Build and Package Game

on:
  push:
    branches: [main, master]
    # 注释掉 tags 触发，推送标签不会自动创建 Release
    # tags:
    #   - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch: # 允许手动触发（在 GitHub Actions 页面手动运行）

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MonoGame templates
        run: dotnet new install MonoGame.Templates.CSharp

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish Windows Portable
        run: |
          dotnet publish -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -o ./publish/win-portable

      - name: Download Inno Setup
        run: |
          curl -L -o is.exe https://jrsoftware.org/download.php/is.exe
          start /wait is.exe /verysilent /suppressmsgboxes
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create Inno Setup Script
        run: |
          $version = (Get-Content "Purge_v0.4.0.csproj" | Select-String "<Version>(.*)</Version>").Matches.Groups[1].Value
          if (-not $version) { $version = "0.4.0" }

          @"
          [Setup]
          AppName=Purge
          AppVersion=$version
          AppVerName=Purge $version
          AppPublisher=MG-feng
          AppPublisherURL=https://github.com/MG-feng/Purge
          AppSupportURL=https://github.com/MG-feng/Purge
          AppUpdatesURL=https://github.com/MG-feng/Purge/releases
          DefaultDirName={autopf}\Purge
          DefaultGroupName=Purge
          AllowNoIcons=yes
          LicenseFile=LICENSE
          OutputDir=installer_output
          OutputBaseFilename=Purge_v${version}_Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\Purge_v0.4.0.exe

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          Name: "chinesesimplified"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Create a &desktop icon"; GroupDescription: "Additional icons:"

          [Files]
          Source: "publish\win-portable\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [Icons]
          Name: "{group}\Purge"; Filename: "{app}\Purge_v0.4.0.exe"
          Name: "{group}\Uninstall Purge"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\Purge"; Filename: "{app}\Purge_v0.4.0.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\Purge_v0.4.0.exe"; Description: "Launch Purge"; Flags: postinstall nowait skipifsilent
          "@ | Out-File -FilePath installer.iss -Encoding utf8

      - name: Build Inno Setup Installer
        run: iscc installer.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Purge-Windows-Setup
          path: installer_output/*.exe

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: Purge-Windows-Portable
          path: publish/win-portable/

  build-macos:
    name: Build macOS Application
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MonoGame templates
        run: dotnet new install MonoGame.Templates.CSharp

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish macOS App
        run: |
          dotnet publish -c Release -r osx-x64 --self-contained true -p:PublishReadyToRun=true -o ./publish/osx-app
          mkdir -p Purge.app/Contents/MacOS
          cp -r publish/osx-app/* Purge.app/Contents/MacOS/

          cat > Purge.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Purge</string>
              <key>CFBundleDisplayName</key>
              <string>Purge</string>
              <key>CFBundleIdentifier</key>
              <string>com.mgfeng.purge</string>
              <key>CFBundleVersion</key>
              <string>0.4.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>Purge_v0.4.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          chmod +x Purge.app/Contents/MacOS/Purge_v0.4.0

      - name: Zip macOS App
        run: zip -r Purge-macOS.zip Purge.app

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: Purge-macOS
          path: Purge-macOS.zip

